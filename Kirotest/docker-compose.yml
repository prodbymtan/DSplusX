version: "3.9"

services:
  # ── PostgreSQL with PostGIS ─────────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    container_name: healthslot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: healthslot
      POSTGRES_PASSWORD: healthslot_dev_password
      POSTGRES_DB: healthslot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthslot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: healthslot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthslot-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://healthslot:healthslot_dev_password@db:5432/healthslot
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev_secret_key_change_in_production_min_32_chars
      DEBUG: "true"
      FIREBASE_CREDENTIALS_PATH: /app/firebase-credentials.json
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # Mount your Firebase service account JSON here:
      # - ./firebase-credentials.json:/app/firebase-credentials.json:ro

volumes:
  postgres_data:
